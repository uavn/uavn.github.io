<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Musvis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Bad+Script&family=Balsamiq+Sans:wght@700&family=Comfortaa:wght@600;700&family=Exo+2:wght@600;800&family=Inter:wght@400;650;800&family=Jura:wght@600;700&family=Kelly+Slab&family=Manrope:wght@600;800&family=Marck+Script&family=Montserrat+Alternates:wght@700;800&family=Neucha&family=Oswald:wght@500;700&family=Pangolin&family=Play:wght@700&family=Press+Start+2P&family=Roboto+Slab:wght@700;800&family=Rubik+Glitch&family=Rubik+Mono+One&family=Russo+One&family=Sofia+Sans+Condensed:wght@700;900&family=Underdog&family=Unbounded:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="stage">
        <canvas id="visualizer" width="1280" height="720" aria-label="Audio visualization preview"></canvas>
        <div class="empty-state" id="emptyState">
          <div class="empty-mark"></div>
          <h1>Musvis</h1>
          <p>Choose an MP3 to build a downloadable music video.</p>
        </div>
      </section>

      <aside class="controls" aria-label="Video controls">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <strong>Musvis</strong>
            <span>Audio reactive video maker</span>
          </div>
        </div>

        <label class="file-picker">
          <input id="audioFile" type="file" accept="audio/mpeg,audio/mp3,audio/*" />
          <span>Choose MP3</span>
        </label>

        <div class="track-meta" id="trackMeta">No track selected</div>

        <audio id="audio" controls preload="metadata"></audio>

        <div class="field">
          <label for="styleSelect">Visual style</label>
          <select id="styleSelect">
            <option value="synthwave" selected>Miami Vice</option>
            <option value="rings">Pulse rings</option>
            <option value="bars">Spectrum bars</option>
            <option value="tunnel">Light tunnel</option>
            <option value="bloom">Radial bloom</option>
            <option value="particles">Particle field</option>
            <option value="album">Album glow</option>
          </select>
        </div>

        <div class="field">
          <label for="paletteSelect">Palette</label>
          <select id="paletteSelect">
            <option value="miami" selected>Miami Vice</option>
            <option value="signal">Signal</option>
            <option value="ember">Ember</option>
            <option value="glass">Glass</option>
            <option value="neon">Neon</option>
            <option value="laser">Laser night</option>
            <option value="aurora">Aurora</option>
            <option value="candy">Candy chrome</option>
            <option value="monoGold">Mono gold</option>
            <option value="icefire">Ice fire</option>
            <option value="toxic">Toxic arcade</option>
            <option value="plasma">Plasma pop</option>
            <option value="midnight">Midnight drive</option>
            <option value="bubblegum">Bubblegum</option>
            <option value="matrix">Matrix</option>
            <option value="sunset">Sunset tape</option>
            <option value="royal">Royal violet</option>
            <option value="acid">Acid wash</option>
          </select>
        </div>

        <div class="field">
          <label for="intensity">Intensity <span id="intensityValue">72</span></label>
          <input id="intensity" type="range" min="20" max="120" value="72" />
        </div>

        <div class="field">
          <label for="qualitySelect">Export quality</label>
          <select id="qualitySelect">
            <option value="720">720p</option>
            <option value="1080">1080p</option>
            <option value="2160" selected>4K</option>
          </select>
        </div>

        <div class="field">
          <label for="aspectSelect">Aspect ratio</label>
          <select id="aspectSelect">
            <option value="16:9">16:9</option>
            <option value="16:10">16:10</option>
            <option value="4:3">4:3</option>
            <option value="1:1">1:1</option>
            <option value="3:4">3:4</option>
            <option value="9:16">9:16</option>
          </select>
        </div>

        <div class="field">
          <label for="authorInput">Author</label>
          <input id="authorInput" type="text" maxlength="80" placeholder="Artist name" />
        </div>

        <div class="field">
          <label for="titleInput">Title</label>
          <input id="titleInput" type="text" maxlength="100" placeholder="Track title" />
        </div>

        <div class="field">
          <label for="overlayPosition">Text position</label>
          <select id="overlayPosition">
            <option value="top-left">Top left</option>
            <option value="top-right">Top right</option>
            <option value="bottom-left" selected>Bottom left</option>
            <option value="bottom-right">Bottom right</option>
          </select>
        </div>

        <div class="field">
          <label for="overlayFont">Text font</label>
          <select id="overlayFont">
            <option value="inter">Inter</option>
            <option value="russo">Russo One</option>
            <option value="rubikMono">Rubik Mono One</option>
            <option value="unbounded">Unbounded</option>
            <option value="exo">Exo 2</option>
            <option value="play">Play</option>
            <option value="jura">Jura</option>
            <option value="comfortaa">Comfortaa</option>
            <option value="manrope">Manrope</option>
            <option value="montserratAlt">Montserrat Alternates</option>
            <option value="sofia">Sofia Sans Condensed</option>
            <option value="oswald">Oswald</option>
            <option value="robotoSlab">Roboto Slab</option>
            <option value="pressStart">Press Start 2P</option>
            <option value="rubikGlitch">Rubik Glitch</option>
            <option value="kelly">Kelly Slab</option>
            <option value="amatic">Amatic SC</option>
            <option value="balsamiq">Balsamiq Sans</option>
            <option value="pangolin">Pangolin</option>
            <option value="neucha">Neucha</option>
            <option value="badScript">Bad Script</option>
            <option value="marck">Marck Script</option>
            <option value="underdog">Underdog</option>
            <option value="comicSans">Comic Sans :)</option>
            <option value="impact">Impact</option>
            <option value="system">System</option>
            <option value="serif">Serif</option>
            <option value="mono">Mono</option>
          </select>
        </div>

        <div class="field">
          <label for="overlaySize">Text size <span id="overlaySizeValue">60%</span></label>
          <input id="overlaySize" type="range" min="50" max="220" value="60" />
        </div>

        <label class="check-field">
          <input id="overlayPulse" type="checkbox" />
          <span>Pulse text with audio</span>
        </label>

        <div class="field">
          <label for="overlayPulseAmount">Pulse amount <span id="overlayPulseValue">18%</span></label>
          <input id="overlayPulseAmount" type="range" min="4" max="45" value="18" />
        </div>

        <div class="button-row">
          <button id="playButton" type="button" disabled>Play</button>
          <button id="recordButton" type="button" disabled>Record video</button>
        </div>

        <button id="fullscreenButton" type="button">Full screen preview</button>

        <a id="downloadLink" class="download-link" download="musvis-video.webm" hidden>Download video</a>

        <p class="status" id="status">Waiting for an audio file.</p>

        <p class="footer">
          👨🏻‍💻 Developed by <a href="https://github.com/uavn" target="_blank">Artem</a>.
        </p>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
