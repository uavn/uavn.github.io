<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Artem Bondarenko</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta charset="UTF-8" />
        <meta name="description" content="Artem Bondarenko — software engineer, game developer and film photographer." />
        <meta name="keywords" content="Software Engineer, Unity Developer, Web Developer, Programmer, Film Photography" />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

        <!-- Bootstrap icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <!-- Stylesheet -->
        <link rel="stylesheet" href="./resources/css/styles.css?v=3" />

        <!-- Scripts -->
        <script src="./resources/scripts/widgets.js?v=3" defer></script>
        <script src="./resources/scripts/scripts.js?v=3" defer></script>

        <!-- Favicon -->
        <link rel="apple-touch-icon" href="./resources/logo.png" />
        <link rel="icon" href="./resources/logo.png" />
    </head>

    <body>
        <header class="menubar">
            <button type="button" class="menubar-logo" data-menu-toggle="system" aria-label="System menu">
                <i class="bi bi-circle-half"></i>
            </button>
            <span class="menubar-app" id="menubar-app">Desktop</span>
            <nav class="menubar-links" aria-label="Quick links">
                <button type="button" data-open="AboutMe">About</button>
                <button type="button" data-open="Photos">Photos</button>
                <button type="button" data-launchpad>Apps</button>
            </nav>
            <div class="menubar-status">
                <a href="https://github.com/uavn" target="_blank" rel="noreferrer" aria-label="GitHub"><i class="bi bi-github"></i></a>
                <a href="mailto:artbonvic@gmail.com" aria-label="Email"><i class="bi bi-envelope"></i></a>
                <span id="clock" class="clock"></span>
            </div>

            <div class="menu" id="menu-system" role="menu">
                <button type="button" role="menuitem" data-open="AboutMe">About This Site</button>
                <hr />
                <button type="button" role="menuitem" data-open="Settings">Wallpaper&hellip;</button>
                <button type="button" role="menuitem" data-launchpad>All Apps&hellip;</button>
                <hr />
                <button type="button" role="menuitem" data-close-all>Close All Windows</button>
            </div>
        </header>

        <main class="desktop" id="desktop">
            <section class="desktop-note">
                <h1>Artem Bondarenko</h1>
                <p>Lead software engineer, game developer, and film photographer. Calgary, AB.</p>
                <div class="desktop-note-actions">
                    <button type="button" class="pill pill--primary" data-open="Photos"><i class="bi bi-camera"></i> Photos</button>
                    <button type="button" class="pill" data-open="AboutMe"><i class="bi bi-person"></i> About me</button>
                </div>
            </section>
        </main>

        <div class="window-layer" id="window-layer"></div>

        <nav class="dock" id="dock" aria-label="Dock"></nav>

        <div class="launchpad" id="launchpad" aria-hidden="true">
            <div class="launchpad-grid" id="launchpad-grid"></div>
        </div>

        <template id="window-tpl">
            <div class="window" role="dialog">
                <div class="window-header">
                    <div class="window-controls">
                        <button type="button" class="window-control window-control--close" data-window-action="close" aria-label="Close"></button>
                        <button type="button" class="window-control window-control--minimize" data-window-action="minimize" aria-label="Minimize"></button>
                        <button type="button" class="window-control window-control--maximize" data-window-action="maximize" aria-label="Zoom"></button>
                    </div>
                    <span class="window-header-title"></span>
                </div>
                <div class="window-body"></div>
            </div>
        </template>
    </body>
</html>
