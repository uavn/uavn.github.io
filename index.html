<!DOCTYPE html>
<html lang="en">
    <head>
        <title>UAVN//OS - Artem Bondarenko</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta charset="UTF-8" />
        <meta name="keywords" content="Software Engineer, Unity Developer, Web Developer, Programmer" />

        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

        <!-- Bootstrap icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <!-- Stylesheet -->
        <link rel="stylesheet" href="./resources/css/styles.css?v=2" />

        <!-- Scripts -->
        <script src="./resources/scripts/boot.js"></script>
        <script src="./resources/scripts/widgets.js"></script>
        <script src="./resources/scripts/utils.js"></script>
        <script src="./resources/scripts/scripts.js"></script>

        <!-- Favicon -->
        <link rel="apple-touch-icon" href="./resources/logo.png" />
        <link rel="icon" href="./resources/logo.png" />
    </head>

    <body>
        <div class="fx fx-grain"></div>
        <div class="fx fx-flicker"></div>

        <div id="boot" class="boot" aria-hidden="true"></div>

        <div class="hud-rec">
            <span class="rec"><span class="dot"></span>rec</span>
            <span id="hud-timecode">00:00:00:00</span>
        </div>

        <div class="system-banner">
            [ warn ] system under construction
        </div>

        <div class="desktop">
            <wtf-icon data-icon-id="about-me" data-icon="<i class='icon-img bi bi-file-earmark-person'></i>" data-title="About Me" data-click="openApp('AboutMe')"></wtf-icon>
            <wtf-icon data-icon-id="out-of-gas" data-icon="<img class='icon-img' src='./resources/oug.png'/>" data-title="Out Of Gas" data-click="openApp('OutOfGas')"></wtf-icon>
            <wtf-icon data-icon-id="mova-nova" data-icon="<i class='icon-img bi bi-translate'></i>" data-title="Mova Nova" data-click="openApp('MovaNova')"></wtf-icon>
            <wtf-icon data-icon-id="weather" data-icon="<i class='icon-img bi bi-cloud-sun'></i>" data-title="Weather" data-click="openApp('Weather')"></wtf-icon>
            <wtf-icon data-icon-id="musvis" data-icon="<i class='icon-img bi bi-music-note-beamed'></i>" data-title="Music Visualizer" data-click="openApp('MusVis')"></wtf-icon>
            <wtf-icon data-icon-id="ninety-pines" data-icon="<i class='icon-img bi bi-tree-fill'></i>" data-title="Ninety Pines" data-click="openApp('NinetyPines')"></wtf-icon>
            <wtf-icon data-icon-id="unicorn-noir" data-icon="<i class='icon-img bi bi-rainbow'></i>" data-title="Unicorn Noir" data-click="openApp('UnicornNoir')"></wtf-icon>
            <wtf-icon data-icon-id="medieval-drift" data-icon="<i class='icon-img bi bi-tornado'></i>" data-title="Medieval Drift" data-click="openApp('MedievalDrift')"></wtf-icon>
        </div>

        <div class="hud-log" id="hud-log" aria-hidden="true"></div>

        <div class="start-menu">
            <div class="start-menu-inner">
                <wtf-button data-title="<span class='start-button-label'><span class='start-button-glyph'>▚</span>main</span>" data-click="start()"></wtf-button>

                <div class="taskbar-host"><b>guest</b>@uavn:~ &middot; uplink <b>ok</b></div>

                <div class="taskbar-apps" id="taskbar-apps" aria-label="Open windows"></div>

                <div id="clock" class="clock">
                    12:00 PM
                </div>
            </div>
        </div>

        <div id="start-panel" class="start-panel" aria-hidden="true">
            <div class="start-panel-brand">
                <span class="brand-title">UAVN//OS</span>
                <span class="brand-version">v0.9</span>
            </div>
            <div class="start-panel-items">
                <button type="button" class="start-panel-item" data-action="openApp('OutOfGas')">
                    <i class="bi bi-controller"></i>
                    <span>Out Of Gas</span>
                </button>
                <button type="button" class="start-panel-item" data-action="openApp('AboutMe')">
                    <i class="bi bi-file-earmark-person"></i>
                    <span>About Me</span>
                </button>
                <button type="button" class="start-panel-item" data-action="openApp('MovaNova')">
                    <i class="bi bi-translate"></i>
                    <span>Mova Nova</span>
                </button>
                <button type="button" class="start-panel-item" data-action="openApp('Weather')">
                    <i class="bi bi-cloud-sun"></i>
                    <span>Weather</span>
                </button>
                <button type="button" class="start-panel-item" data-action="openApp('UnicornNoir')">
                    <i class="bi bi-rainbow"></i>
                    <span>Unicorn Noir</span>
                </button>
                <button type="button" class="start-panel-item" data-action="openApp('MedievalDrift')">
                    <i class="bi bi-tornado"></i>
                    <span>Medieval Drift</span>
                </button>
                <button type="button" class="start-panel-item" data-action="openApp('NinetyPines')">
                    <i class="bi bi-tree-fill"></i>
                    <span>Ninety Pines</span>
                </button>
                <button type="button" class="start-panel-item" data-action="openApp('MusVis')">
                    <i class="bi bi-music-note-beamed"></i>
                    <span>Music Visualizer</span>
                </button>
                <hr />
                <button type="button" class="start-panel-item start-panel-item--danger" data-action="turnOff()">
                    <i class="bi bi-power"></i>
                    <span>Turn Off...</span>
                </button>
            </div>
        </div>

        <div id="shutdown-notice" class="shutdown-notice" aria-hidden="true">
            <div class="shutdown-screen" role="dialog" aria-modal="true" aria-labelledby="shutdown-title">
                <p id="shutdown-title">connection terminated.<br />it is now safe to close this window.</p>

                <button type="button" class="btn" data-shutdown-dismiss>
                    <span class="btn-layer-1">Return</span>
                </button>
            </div>
        </div>

        <template id="wtf-icon-tpl">
            <a href="#" class="icon" data-icon-id="{{iconId}}">
                {{icon}}

                <span>{{title}}</span>
            </a>
        </template>

        <template id="window-tpl">
            <div class="window">
                <div class="window-inner">
                    <div class="window-header">
                        <span class="window-header-title">{{appName}}</span>
                        <div class="window-controls">
                            <wtf-button data-title="_" data-click="minimizeWindow(event)"></wtf-button>
                            <wtf-button data-title="□" data-click="toggleMaximizeWindow(event)"></wtf-button>
                            <wtf-button data-title="×" data-click="closeModal(event)"></wtf-button>
                        </div>
                    </div>

                    <div class="window-body">
                        {{content}}
                    </div>
                </div>
            </div>
        </template>

        <template id="wtf-button-tpl">
            <a href="#" class="btn">
                <span class="btn-layer-1">
                    {{title}}
                </span>
            </a>
        </template>
    </body>
</html>
