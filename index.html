<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Software Engineer - Artem Bondarenko</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta charset="UTF-8" />
        <meta name="keywords" content="Software Engineer, Unity Developer, Web Developer, Programmer" />

        <!-- Google Fonts -->
        <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

        <!-- Bootstrap icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <!-- Stylesheet -->
        <link rel="stylesheet" href="./resources/css/styles.css" />

        <!-- Scripts -->
        <script src="./resources/scripts/widgets.js"></script>
        <script src="./resources/scripts/utils.js"></script>
        <script src="./resources/scripts/scripts.js"></script>

        <!-- Favicon -->
        <link rel="apple-touch-icon" href="./resources/logo.png" />
        <link rel="icon" href="./resources/logo.png" />
    </head>

    <body>
        <div class="system-banner">
            site is under construction...
        </div>

        <div class="desktop">
            <wtf-icon data-icon="<i class='icon-img bi bi-file-earmark-person'></i>" data-title="About Me" data-click="openApp('AboutMe')"></wtf-icon>
            <wtf-icon data-icon="<img class='icon-img' src='./resources/oug.png'/>" data-title="Out Of Gas" data-click="openApp('OutOfGas')"></wtf-icon>
            <wtf-icon data-icon="<i class='icon-img bi bi-translate'></i>" data-title="Mova Nova" data-click="openApp('MovaNova')"></wtf-icon>
        </div>

        <div class="start-menu">
            <div class="start-menu-inner">
                <wtf-button data-title="<i class='bi bi-play-fill'></i> Start" data-click="start()"></wtf-button>

                <div class="taskbar-apps" id="taskbar-apps" aria-label="Open windows"></div>

                <div id="clock" class="clock">
                    12:00 PM
                </div>
            </div>
        </div>

        <div id="start-panel" class="start-panel" aria-hidden="true">
            <div class="start-panel-brand">
                <span class="brand-title">UAVN</span>
                <span class="brand-version">OS</span>
            </div>
            <div class="start-panel-items">
                <button type="button" class="start-panel-item" data-action="openApp('OutOfGas')">
                    <i class="bi bi-controller"></i>
                    <span>Out Of Gas</span>
                </button>
                <button type="button" class="start-panel-item" data-action="openApp('AboutMe')">
                    <i class="bi bi-file-earmark-person"></i>
                    <span>About Me</span>
                </button>
                <button type="button" class="start-panel-item" data-action="openApp('MovaNova')">
                    <i class="bi bi-translate"></i>
                    <span>Mova Nova</span>
                </button>
                <hr />
                <button type="button" class="start-panel-item start-panel-item--danger" data-action="turnOff()">
                    <i class="bi bi-power"></i>
                    <span>Turn Off...</span>
                </button>
            </div>
        </div>

        <div id="shutdown-notice" class="shutdown-notice" aria-hidden="true">
            <div class="shutdown-screen" role="dialog" aria-modal="true" aria-labelledby="shutdown-title">
                <p id="shutdown-title">It's now safe to close this website.</p>

                <button type="button" class="btn" data-shutdown-dismiss>
                    <span class="btn-layer-1">Return</span>
                </button>
            </div>
        </div>

        <template id="wtf-icon-tpl">
            <a href="#" class="icon">
                {{icon}}

                <span>{{title}}</span>
            </a>
        </template>

        <template id="window-tpl">
            <div class="window">
                <div class="window-inner">
                    <div class="window-header">
                        <span class="window-header-title">{{appName}}</span>
                        <div class="window-controls">
                            <wtf-button data-title="_" data-click="minimizeWindow(event)"></wtf-button>
                            <wtf-button data-title="[]" data-click="toggleMaximizeWindow(event)"></wtf-button>
                            <wtf-button data-title="×" data-click="closeModal(event)"></wtf-button>
                        </div>
                    </div>

                    <div class="window-body">
                        {{content}}
                    </div>
                </div>
            </div>
        </template>

        <template id="wtf-button-tpl">
            <a href="#" class="btn">
                <span class="btn-layer-1">
                    {{title}}
                </span>
            </a>
        </template>
    </body>
</html>
