<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Film Dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="./styles.css?v=17" />
<script src="./app.js?v=29" defer></script>
</head>
<body>
<div class="film-edge film-edge--top"><span class="edge-print" id="edge-top"></span></div>

<div class="app">
    <aside class="panel setup">
        <section class="section">
            <h3>Process</h3>
            <div class="row"><select id="recipe" aria-label="Process"></select></div>
            <div class="row row--buttons">
                <button type="button" class="btn btn--mini" id="recipe-edit"><i class="bi bi-pencil"></i> Edit</button>
                <button type="button" class="btn btn--mini" id="recipe-copy"><i class="bi bi-copy"></i> Duplicate</button>
                <button type="button" class="btn btn--mini" id="recipe-new"><i class="bi bi-plus-lg"></i> New</button>
                <button type="button" class="btn btn--mini btn--danger" id="recipe-delete" title="Delete this process"><i class="bi bi-trash3"></i></button>
            </div>
            <p class="note" id="recipe-note"></p>
        </section>

        <section class="section">
            <h3><span>Film</span><img class="h-icon" src="./art/canister.webp" alt="" /></h3>
            <div class="dials">
                <figure class="dial" id="dial-box"><figcaption>Box speed</figcaption></figure>
                <figure class="dial" id="dial-shot"><figcaption>Shot at</figcaption></figure>
            </div>
            <div class="field field--stack">
                <label>Expired</label>
                <div class="decades" role="group" aria-label="Years past the date">
                    <button type="button" class="btn btn--mini" data-decades="0">Fresh</button>
                    <button type="button" class="btn btn--mini" data-decades="1">10 y</button>
                    <button type="button" class="btn btn--mini" data-decades="2">20 y</button>
                    <button type="button" class="btn btn--mini" data-decades="3">30 y</button>
                    <button type="button" class="btn btn--mini" data-decades="4">40 y</button>
                    <button type="button" class="btn btn--mini" data-decades="5">50 y</button>
                </div>
            </div>
            <div class="field"><label for="storage">Stored</label><select id="storage"><option value="frozen">Frozen</option><option value="fridge">Fridge</option><option value="room">Room temperature</option><option value="hot">Hot / unknown</option></select></div>
            <div class="push-readout"><span id="stops-out"></span><span class="note" id="stops-note"></span></div>
            <p class="note note--warn" id="expired-tip"></p>
        </section>

        <section class="section">
            <h3><span>Chemistry</span><img class="h-icon" src="./art/thermometer.webp" alt="" /></h3>
            <div class="field"><label for="rolls-used" title="Rolls already developed in this chemistry">Rolls used</label><input type="number" id="rolls-used" min="0" max="200" step="1" /></div>
        </section>

        <section class="section">
            <h3>Between steps</h3>
            <div class="segmented" role="radiogroup" aria-label="Between steps">
                <label><input type="radio" name="pause" value="manual" /> Wait for my click</label>
                <label><input type="radio" name="pause" value="auto" /> Go on by itself after</label>
            </div>
            <div class="field"><label for="pause-seconds">Pause</label><div class="field-inline"><input type="number" id="pause-seconds" min="0" max="300" step="1" /><span class="unit">s</span></div></div>
        </section>

        <section class="section">
            <h3>Alerts</h3>
            <div class="field"><label for="drain-lead" title="Optional: say “get ready to drain” this many seconds before the end. 0 = off; “drain” itself comes when the time is up.">Drain heads-up</label><div class="field-inline"><input type="number" id="drain-lead" min="0" max="60" step="1" /><span class="unit">s</span></div></div>
            <div class="field"><label for="prep-lead" title="Remind to get the next bath ready this many seconds before the end">Next bath</label><div class="field-inline"><input type="number" id="prep-lead" min="0" max="300" step="5" /><span class="unit">s</span></div></div>
            <div class="field"><label for="voice">Voice</label><div class="field-inline"><input type="checkbox" id="voice" /><select id="voice-lang"><option value="en">English</option><option value="uk">Українська</option></select></div></div>
            <div class="field"><label for="beeps">Beeps</label><input type="checkbox" id="beeps" /></div>
        </section>
    </aside>

    <main class="main">
        <section class="strip" aria-label="Plan">
            <div class="strip-head"><span>Plan</span><span class="total"><img class="h-icon" src="./art/stopwatch.webp" alt="" /><span id="total"></span></span></div>
            <ol class="frames" id="steps"></ol>
        </section>

        <section class="stage">
            <div class="tank-wrap">
                <div class="tank" id="tank" data-state="idle" aria-hidden="true">
                    <img class="tank-art tank-art--tank" src="./art/tank.webp" alt="" />
                    <img class="tank-art tank-art--pour" src="./art/pour.webp" alt="" />
                    <img class="tank-art tank-art--drain" src="./art/drain.webp" alt="" />
                    <img class="tank-art tank-art--wash" src="./art/wash.webp" alt="" />
                    <img class="tank-art tank-art--extra" id="tank-extra" src="./art/loading.webp" alt="" />
                    <span class="tank-label" id="tank-label"></span>
                </div>
                <div class="tank-caption" id="tank-caption"></div>
            </div>

            <div class="readout">
                <div class="nonstd" id="nonstd" hidden></div>
                <div class="step-label" id="step-label">Ready</div>
                <div class="time" id="time">0:00</div>
                <div class="action" id="action">Pick a process and press Start</div>
                <div class="next" id="next"></div>
                <div class="progress" aria-hidden="true">
                    <div class="progress-fill" id="progress-fill"></div>
                    <div class="progress-marks" id="marks"></div>
                </div>
                <div class="controls">
                    <button type="button" class="btn btn--primary btn--big" id="start"><i class="bi bi-play-fill"></i> Start</button>
                    <button type="button" class="btn btn--big" id="pause" hidden><i class="bi bi-pause-fill"></i> Pause</button>
                    <button type="button" class="btn btn--primary btn--big" id="go-next" hidden><i class="bi bi-skip-forward-fill"></i> Next step</button>
                    <button type="button" class="btn" id="plus10" hidden title="Add 10 seconds to this step">+10 s</button>
                    <button type="button" class="btn" id="skip" hidden title="End this step now"><i class="bi bi-skip-end-fill"></i> Skip</button>
                    <button type="button" class="btn btn--danger" id="stop" hidden title="Stop the run"><i class="bi bi-stop-fill"></i> Stop</button>
                </div>
                <div class="quick">
                    <button type="button" class="btn btn--toggle" id="q-voice" title="Voice"><i class="bi bi-chat-square-quote"></i></button>
                    <button type="button" class="btn btn--toggle" id="q-beeps" title="Beeps"><i class="bi bi-bell"></i></button>
                </div>
                <p class="hint" id="hint"></p>
            </div>
        </section>
    </main>
</div>

<div class="film-edge film-edge--bottom"><span class="edge-print" id="edge-bottom"></span></div>

<dialog class="confirm" id="confirm" aria-labelledby="confirm-title">
    <div class="confirm-body">
        <h2 id="confirm-title">⚠ Non-standard run</h2>
        <p>This isn’t a regular development. Check before you pour:</p>
        <ul id="confirm-list"></ul>
        <p class="confirm-time" id="confirm-time"></p>
        <div class="confirm-actions">
            <button type="button" class="btn" id="confirm-cancel">Cancel</button>
            <button type="button" class="btn btn--primary" id="confirm-start"><i class="bi bi-play-fill"></i> Start anyway</button>
        </div>
    </div>
</dialog>

<dialog class="editor" id="editor">
    <form method="dialog" class="editor-body" id="editor-form">
        <header class="editor-head">
            <input type="text" id="ed-name" class="editor-title" maxlength="60" aria-label="Process name" />
            <button type="button" class="btn btn--icon" id="ed-close" aria-label="Close"><i class="bi bi-x-lg"></i></button>
        </header>
        <div class="editor-grid">
            <label>Push / pull
                <select id="ed-push-mode">
                    <option value="add">Add seconds per stop</option>
                    <option value="percent">Percent per stop</option>
                    <option value="table">Table (time per stop)</option>
                </select>
            </label>
            <label data-push="add">Push, s / stop <input type="number" id="ed-push-add" step="1" /></label>
            <label data-push="add">Pull, s / stop <input type="number" id="ed-pull-add" step="1" /></label>
            <label data-push="percent">Push, % / stop <input type="number" id="ed-push-pct" step="1" /></label>
            <label data-push="percent">Pull, % / stop <input type="number" id="ed-pull-pct" step="1" /></label>
            <label data-push="table" class="wide">Times, stops −2…+3 <input type="text" id="ed-push-table" placeholder="-1: 2:45, +1: 4:33, +2: 6:08, +3: 8:45" /></label>
            <label>Temp. compensation, % / °C <input type="number" id="ed-temp-coef" step="0.5" title="How much longer per degree colder (and shorter per degree warmer); used outside the table" /></label>
            <label class="wide">Temp. table, °C: normal time <input type="text" id="ed-temp-table" placeholder="38.9: 3:30, 35: 5:45, 32.2: 8:30" /></label>
            <label>Colour process <input type="checkbox" id="ed-colour" title="Warn when the developer is away from its temperature" /></label>
            <label>Film type (for expiry)
                <select id="ed-film-type">
                    <option value="neg">Colour negative</option>
                    <option value="slide">Slide</option>
                    <option value="bw">Black &amp; white</option>
                </select>
            </label>
            <label>Reuse, % / roll <input type="number" id="ed-reuse-pct" step="0.5" /></label>
            <label>Reuse, s per <input type="number" id="ed-reuse-add" step="1" /></label>
            <label>…every N rolls <input type="number" id="ed-reuse-batch" min="1" step="1" /></label>
            <label class="wide">Notes <input type="text" id="ed-note" maxlength="240" /></label>
        </div>
        <div class="editor-steps-head">
            <span>Step</span><span>Bath</span><span>°C</span><span>to °C</span><span>Time</span><span title="Affected by push/pull, temperature and reuse">Dev</span><span title="Continuous agitation at the start, seconds">Agit. s</span><span title="Rest between inversion rounds, seconds">Rest</span><span title="Inversions each round">×</span><span>Note</span><span></span>
        </div>
        <div class="editor-steps" id="ed-steps"></div>
        <footer class="editor-foot">
            <button type="button" class="btn" id="ed-add-step"><i class="bi bi-plus-lg"></i> Add step</button>
            <span class="spacer"></span>
            <button type="button" class="btn" id="ed-cancel">Cancel</button>
            <button type="button" class="btn btn--primary" id="ed-save">Save</button>
        </footer>
    </form>
</dialog>
</body>
</html>
